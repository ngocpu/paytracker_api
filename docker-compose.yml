services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paytracker_api
    ports:
      - "8000:8000"
    env_file:
      - .env.development
    volumes:
      - .:/src
    working_dir: /src
    command: >
      sh -c "sleep 10 && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: paytracker_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

volumes:
  db_data:
